name: Registry consumers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published module version
        required: true
        default: "0.2.1"

permissions:
  contents: read

jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MODULE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" update
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/install-moonbit.ps1"
          & "$env:RUNNER_TEMP/install-moonbit.ps1"
          "$env:USERPROFILE/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE/.moon/bin/moon.exe" update
      - name: Install and verify the published module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MODULE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a release version' }
          $consumerDir = Join-Path $env:RUNNER_TEMP 'registry-consumer'
          $installDir = Join-Path $env:RUNNER_TEMP 'registry-bin'
          New-Item -ItemType Directory -Path $consumerDir -Force | Out-Null
          Copy-Item -LiteralPath examples/library/moon.mod,examples/library/moon.pkg,examples/library/consumer_test.mbt -Destination $consumerDir
          Push-Location -LiteralPath $consumerDir
          moon version --all
          moon add --upgrade "shen-E/moonvigil@$env:MODULE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Registry add failed' }
          moon test --target all --deny-warn
          if ($LASTEXITCODE -ne 0) { throw 'Library consumer failed' }
          moon install "shen-E/moonvigil/cmd/moonvigil@$env:MODULE_VERSION" --bin $installDir
          if ($LASTEXITCODE -ne 0) { throw 'CLI installation failed' }
          Pop-Location
          $command = Join-Path $installDir 'moonvigil'
          if ($IsWindows) { $command += '.exe' }
          $actualVersion = & $command --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne "MoonVigil $env:MODULE_VERSION") { throw 'Wrong CLI version' }
          $actualVersion
          & $command scan fixtures/affected --db advisories.json --format json
          if ($LASTEXITCODE -ne 1) { throw 'Expected an affected finding' }
          & $command scan fixtures/real/moonbitlang-parser --db fixtures/empty-database.json --format json
          if ($LASTEXITCODE -ne 0) { throw 'Expected a clean inventory' }
          & $command scan fixtures/affected --format invalid
          if ($LASTEXITCODE -ne 2) { throw 'Expected an invalid-input diagnostic' }
          exit 0
